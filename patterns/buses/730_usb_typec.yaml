# ==============================================================================
# USB 2.0 / USB 3.x SuperSpeed / Type-C 複合傳輸介面規範
# ==============================================================================
# 開頭說明:
# 1. 協定簡介:
#    涵蓋通用序列匯流排 (USB) 全系列傳輸協定與 USB-C 介面架構：
#    - USB 2.0 傳統高速差分對 (DP / DM, 480 Mbps)
#    - USB 3.x / USB4 / Thunderbolt SuperSpeed 超高速發射與接收對 (SSTX_P/N, SSRX_P/N, 5Gbps ~ 40Gbps)
#    - Type-C 配置通道 (CC1, CC2): 用於插拔偵測、方向識別 (Orientation) 與 USB PD 電力傳輸協議握手
#    - Type-C 側頻使用通道 (SBU1, SBU2): 用於 DisplayPort Alt-Mode 或音訊配件模式
#    - Type-C 輔助通道 (AUXP, AUXN): DisplayPort 輔助溝通通道
# 2. 電氣特性與硬體要求:
#    - SuperSpeed 差分發射端 (SSTX) 規範強制要求串接 100nF (0.1uF) AC 耦合電容。
#    - CC1 / CC2 在作為 UFP (受電端/設備端) 時，必須各自具備 5.1kΩ (±1%) 的對地下拉電阻 (Rd)；
#      在作為 DFP (供電端/主機端) 時，則需上拉電阻 (Rp) 至 5V 或 3.3V 以宣告供電能力。
#    - USB 2.0 差分阻抗為 90Ω ± 10%，USB 3.x 差分阻抗通常為 85Ω 或 90Ω。
# 3. 典型應用:
#    PC/主機板 Type-C 接口、USB 集線器 (Hub)、Type-C 擴充塢 (Docking)、外接 SSD、手機/平板傳輸孔。
# 4. 下游 Level 3 DRC 檢驗相依性:
#    - [DRC_USB_01] Type-C CC1 / CC2 腳位是否具備正確的 5.1kΩ 對地下拉電阻或上拉電阻 (CC Termination Check)。
#    - [DRC_USB_02] SuperSpeed 差分通道 (SSTX / SSRX) 是否串聯 AC 耦合電容，且 P/N 兩端電容容值/耐壓是否對稱。
#    - [DRC_USB_03] 檢查 USB 外露接口之 DP/DM 與 TX/RX 是否配備 ESD / TVS 陣列保護二極體。
# ------------------------------------------------------------------------------
name: "USB"
category: "Communication"
priority: 730 # 優先級 730

signals:
  # ----------------------------------------------------------------------------
  # USB_DP: USB 2.0 資料正端 (Data Plus) - 選擇性 (Optional)
  # ----------------------------------------------------------------------------
  - role: "USB_DP"
    required: false
    group_key: true
    matches:
      match_any:
        # 情境 A (高信心度 0.5): 網路名稱包含 USB/TYPEC 且以 DP 或 D+ 標示 (例如: USB_DP, TYPEC_DP, USB0_D+)
        - match_all:
            - net_name_regex: "(?i)(?:USB|TYPEC).*(?:_DP|DP|D\\+|DATA\\+)"
          confidence_contribution: 0.5
        # 情境 B (中信心度 0.4): IC 原廠引腳命名為標準 USB DP 引腳 (例如: 引腳 Pin Name 為 USB_DP, DP, D+)
        - match_all:
            - pin_name_regex: "(?i)(?:USB_DP|DP|D\\+)"
          confidence_contribution: 0.4
        # 情境 C (基礎比對 0.2): 網路名稱以 _DP 結尾或單純為 D+ (例如: IO_DP, D+)
        - match_all:
            - net_name_regex: "(?i)(?:_DP\\b|D\\+)"
          confidence_contribution: 0.2

  # ----------------------------------------------------------------------------
  # USB_DM: USB 2.0 資料負端 (Data Minus) - 選擇性 (Optional)
  # ----------------------------------------------------------------------------
  - role: "USB_DM"
    required: false
    group_key: true
    matches:
      match_any:
        # 情境 A (高信心度 0.5): 網路名稱包含 USB/TYPEC 且以 DM 或 D- 標示 (例如: USB_DM, TYPEC_DN, USB0_D-)
        - match_all:
            - net_name_regex: "(?i)(?:USB|TYPEC).*(?:_DN|_DM|DM|D\\-|DATA\\-)"
          confidence_contribution: 0.5
        # 情境 B (中信心度 0.4): IC 原廠引腳命名為標準 USB DM 引腳 (例如: 引腳 Pin Name 為 USB_DM, DM, D-)
        - match_all:
            - pin_name_regex: "(?i)(?:USB_DM|DM|D\\-)"
          confidence_contribution: 0.4
        # 情境 C (基礎比對 0.2): 網路名稱以 _DM/_DN 結尾或單純為 D- (例如: IO_DM, D-)
        - match_all:
            - net_name_regex: "(?i)(?:_DM\\b|_DN\\b|D\\-)"
          confidence_contribution: 0.2

  # ----------------------------------------------------------------------------
  # USB_SS_TX: SuperSpeed 發射差分對 (SSTX_P / SSTX_N) - 選擇性 (Optional)
  # ----------------------------------------------------------------------------
  - role: "USB_SS_TX"
    required: false
    group_key: true
    matches:
      match_any:
        # 情境 A (高信心度 0.6): 網路名稱包含 TCP (Type-C Port) 或 USB 且包含 SSTX 與極性標籤 (例如: TCP0_RT_SSTX0_P, USB_SSTX_N)
        - match_all:
            - net_name_regex: "(?i)(?:TCP|USB).*SSTX.*[PN]"
          confidence_contribution: 0.6
        # 情境 B (中高信心度 0.5): 網路名稱包含 TCP/USB 且包含 TX 通道號與極性 (例如: TCP0_TX0_P, USB3_TX1_N)
        - match_all:
            - net_name_regex: "(?i)(?:TCP|USB).*TX\\d*_[PN]"
          confidence_contribution: 0.5
        # 情境 C (中信心度 0.4): IC 原廠引腳命名為 SSTX 或 TX 通道 (例如: 引腳 Pin Name 為 SSTXP, TX0_P)
        - match_all:
            - pin_name_regex: "(?i)(?:SSTX|TX\\d*[PN])"
          confidence_contribution: 0.4

  # ----------------------------------------------------------------------------
  # USB_SS_RX: SuperSpeed 接收差分對 (SSRX_P / SSRX_N) - 選擇性 (Optional)
  # ----------------------------------------------------------------------------
  - role: "USB_SS_RX"
    required: false
    group_key: true
    matches:
      match_any:
        # 情境 A (高信心度 0.6): 網路名稱包含 TCP 或 USB 且包含 SSRX 與極性標籤 (例如: TCP0_RT_SSRX0_P, USB_SSRX_N)
        - match_all:
            - net_name_regex: "(?i)(?:TCP|USB).*SSRX.*[PN]"
          confidence_contribution: 0.6
        # 情境 B (中高信心度 0.5): 網路名稱包含 TCP/USB 且包含 RX 通道號與極性 (例如: TCP0_RX0_P, USB3_RX1_N)
        - match_all:
            - net_name_regex: "(?i)(?:TCP|USB).*RX\\d*_[PN]"
          confidence_contribution: 0.5
        # 情境 C (中信心度 0.4): IC 原廠引腳命名為 SSRX 或 RX 通道 (例如: 引腳 Pin Name 為 SSRXP, RX0_P)
        - match_all:
            - pin_name_regex: "(?i)(?:SSRX|RX\\d*[PN])"
          confidence_contribution: 0.4

  # ----------------------------------------------------------------------------
  # TYPEC_CC: Type-C 配置通道 (Configuration Channel: CC1 / CC2) - 選擇性 (Optional)
  # ----------------------------------------------------------------------------
  - role: "TYPEC_CC"
    required: false
    group_key: true
    matches:
      match_any:
        # 情境 A (高信心度 0.6): 網路名稱包含 TCP/USB/TYPEC 且帶有 CC1 或 CC2 標記 (例如: TCP0_CC1, USB_CC2, TYPEC_CC1)
        - match_all:
            - net_name_regex: "(?i)(?:TCP|USB|TYPEC).*CC[12]"
          confidence_contribution: 0.6
        # 情境 B (中信心度 0.4): IC 原廠引腳命名為標準 CC1 或 CC2 (例如: 引腳 Pin Name 為 CC1, CC2)
        - match_all:
            - pin_name_regex: "(?i)CC[12]"
          confidence_contribution: 0.4

  # ----------------------------------------------------------------------------
  # TYPEC_SBU: Type-C 側頻使用通道 (Sideband Use: SBU1 / SBU2) - 選擇性 (Optional)
  # ----------------------------------------------------------------------------
  - role: "TYPEC_SBU"
    required: false
    group_key: true
    matches:
      match_any:
        # 情境 A (高信心度 0.6): 網路名稱包含 TCP/USB/TYPEC 且帶有 SBU1 或 SBU2 標記 (例如: TCP0_SBU1, USB_SBU2)
        - match_all:
            - net_name_regex: "(?i)(?:TCP|USB|TYPEC).*SBU[12]"
          confidence_contribution: 0.6
        # 情境 B (中信心度 0.4): IC 原廠引腳命名為標準 SBU1 或 SBU2 (例如: 引腳 Pin Name 為 SBU1, SBU2)
        - match_all:
            - pin_name_regex: "(?i)SBU[12]"
          confidence_contribution: 0.4

  # ----------------------------------------------------------------------------
  # TYPEC_AUX: Type-C 輔助通道 (Auxiliary Channel: AUXP / AUXN) - 選擇性 (Optional)
  # ----------------------------------------------------------------------------
  - role: "TYPEC_AUX"
    required: false
    group_key: true
    matches:
      match_any:
        # 情境 A (高信心度 0.6): 網路名稱包含 TCP/USB/AUX 且明確以 AUXP 或 AUXN 結尾 (例如: TCP0_AUXP, USB_AUXN)
        - match_all:
            - net_name_regex: "(?i)(?:TCP|USB|AUX).*(?:AUX[PN]|AUXP|AUXN)"
          confidence_contribution: 0.6
        # 情境 B (中信心度 0.4): IC 原廠引腳命名為 AUXP 或 AUXN (例如: 引腳 Pin Name 為 AUXP, AUXN)
        - match_all:
            - pin_name_regex: "(?i)(?:AUX[PN]|AUXP|AUXN)"
          confidence_contribution: 0.4

role_overrides:
  # 拓撲角色覆寫:
  # 1. Type-C CC 腳位對地連接之電阻，升級為 5.1k 下拉電阻 (Pull_down) 用於 UFP 偵測
  - original_sub_category: "Resistor"
    connected_to: "GND"
    new_role: "Pull_down"
  # 2. Type-C CC 腳位連接電源軌之電阻，升級為供電廣播上拉電阻 (Pull_up) 用於 DFP 宣告
  - original_sub_category: "Resistor"
    connected_to: "PowerRail"
    new_role: "Pull_up"
  # 3. 掛載於 AUX 或 SBU 上的電容，升級為濾波電容 (Filter_Capacitor)
  - original_sub_category: "Capacitor"
    connected_to: "Signal"
    new_role: "Filter_Capacitor"
