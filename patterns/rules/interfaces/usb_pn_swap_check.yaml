# ==============================================================================
# USB 差分對正負極性反接與不對稱拓撲檢查 (USB Differential Pair P/N Swap & Asymmetry Check)
# ==============================================================================
# 說明:
# 1. 檢驗標的: USB 2.0 (DP/DM) 與 USB 3.x SuperSpeed (SSTX_P/N, SSRX_P/N) 差分網路。
# 2. 檢驗目標:
#    - 情境 B (端點正負極性反接 / Pin Swap): 追蹤差分對至端點 IC/連接器引腳，驗證正極訊號是否連至負極引腳 (如 DP 誤接至 DN / D- / SSTX_N)。
#    - 情境 C (不對稱/懸空/錯位連線 / Differential Asymmetry): 驗證 P/N 夥伴網路到達的端點元件數量、引腳配置及串聯 AC 耦合電容是否對稱。
# ------------------------------------------------------------------------------
name: "usb_pn_swap_check"
description: "追蹤 USB 差分對 (DP/DM, SSTX/SSRX) 端到端連線，嚴格檢測晶片引腳極性反接 (Scenario B) 與拓撲不對稱/懸空 (Scenario C)"
tags: ["USB", "Differential Pair", "Signal Integrity", "Pin Connection"]
severity: "Error"

trigger_conditions:
  graph_match:
    attributes:
      type: "net"
      net_type: "Differential"

check_logic:
  - type: "python_script"
    script_path: "patterns/rules/interfaces/usb_pn_swap_check.py"
