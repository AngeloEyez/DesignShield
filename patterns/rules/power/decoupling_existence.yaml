# Level 3 設計規則驗證規範 (DRC)
# 規則: 晶片電源引腳去耦電容配置檢查
name: "ic_decoupling_capacitor_existence"
description: "確認所有具備電氣功能之 IC 晶片在電源網路接腳旁是否正確配置去耦/旁路電容"
tags: ["Power Domain", "Decoupling"]
severity: "Warning"

trigger_conditions:
  graph_match:
    attributes:
      type: "component"
      category: "IC"
      is_electrical: true

check_logic:
  - type: "topology_check"
    asserts:
      - condition: "has_decoupling_capacitor"
        node: "${context.target}"
        error_message: "IC 晶片 ${context.target.ref_des} (${context.target.part_value}) 之供電腳位未檢測到去耦電容配置"
