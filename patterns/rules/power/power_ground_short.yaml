# Level 3 設計規則驗證規範 (DRC)
# 規則: 電源-接地短路致命異常檢測
name: "Power_Ground_Short_Fatal"
description: "檢查線路中是否存在同時標註電源與接地屬性之網路節點，防止致命短路燒毀硬體"
tags: ["Power Domain", "Ground", "Short Circuit", "Fatal", "Safety"]
severity: "Fatal"

trigger_conditions:
  graph_match:
    attributes:
      type: "net"
      is_power: true
      is_ground: true

check_logic:
  - type: "topology_check"
    asserts:
      - condition: "attribute_not_equal"
        node: "${context.target}"
        attribute: "is_ground"
        value: true
        error_message: "網路 ${context.target.net_name} 同時掛載電源與接地符號，存在致命電源短路 (Power-to-Ground Short) 異常"
