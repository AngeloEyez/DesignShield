name: "generic_gnd"
enabled: true
category: "GND"
priority: 950

signals:
  - role: "GND"
    required: true
    group_key: false
    matches:
      match_any:
        - match_all:
            - is_ground_symbol_connected: true
        - match_all:
            - symbol_name_regex: "(?i)(?:GND|EARTH|\\b0\\b)"
        - match_all:
            - net_name_regex: "(?i)(?:^(?:GND|AGND|DGND|PGND|SGND|EGND|VSS)|.*THERMAL.*PAD.*)"

extra_fields:
  operating_voltage:
    type: float
    source: "static"
    value: 0.0
