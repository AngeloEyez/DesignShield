# ------------------------------------------------------------------------------
# PartDB 零件規格定義檔: ST_STM32F405
# ------------------------------------------------------------------------------
title: "STM32F405 高效能 ARM Cortex-M4 微控制器"
version: "1.0.0"

revisions:
  - version: "1.0.0"
    date: "2026-10-13"
    author: "Hardware Team"
    description: "初始化建立 STM32F405 規格，包含 VDD/VBAT 供電軌、PA9 VBUS 與 I2C/USB 介面特規"

mfg: "ST"
pn: "STM32F405"
description: "High-performance foundation line, Arm Cortex-M4 core with DSP and FPU, 1 Mbyte of Flash memory, 168 MHz CPU, ART Accelerator"

_meta:
  evidence: "STM32F405_Datasheet_Rev4.pdf"
  page: 1
  excerpt: "High-performance foundation line, ARM Cortex-M4 core with DSP and FPU, 168MHz CPU."

power_rails:
  VDD:
    nominal_voltage_v: 3.3
    voltage_range_v: [1.8, 3.6]
    min_decoupling_caps_uf: [0.1, 4.7]
    description: "Main digital power supply"
  VBAT:
    nominal_voltage_v: 3.0
    voltage_range_v: [1.65, 3.6]
    min_decoupling_caps_uf: [0.1]
    description: "Backup battery power supply"

pinout:
  "PA9":
    name: "USB_OTG_FS_VBUS"
    type: "power_in"
    voltage_max_v: 5.5
    requires_esd: true
    _meta:
      page: 68
      excerpt: "PA9 can be used as VBUS sense. Dedicated ESD protection is strongly recommended."
  "NRST":
    name: "NRST"
    type: "input"
    voltage_range_v: [0.0, 3.6]
    requires_pullup: true
    decoupling:
      min_cap_uf: 0.1

interfaces:
  I2C:
    requires_series_resistor: false
    forbid_gnd_capacitor: true
    pullup_range_ohms: [2000, 10000]
    max_bus_capacitance_pf: 400
    _meta:
      evidence: "STM32F405_Datasheet_Rev4.pdf"
      page: 45
      excerpt: "In Fast-mode Plus, the capacitive load must not exceed 100pF. Avoid external ground capacitors on SCL/SDA to prevent RC timing distortion."
  USB:
    requires_esd_protection: true
    differential_impedance_ohms: 90
    _meta:
      evidence: "AN4879_USB_Hardware_Guidelines.pdf"
      page: 12
      excerpt: "USB 2.0 full-speed requires 90-ohm differential impedance and dedicated ESD protection."
