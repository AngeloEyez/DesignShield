# ------------------------------------------------------------------------------
# PartDB 零件規格定義檔: SENSIRION_SHT40
# ------------------------------------------------------------------------------
title: "SHT40 數位溫濕度感測器"
version: "1.0.0"

revisions:
  - version: "1.0.0"
    date: "2026-10-13"
    author: "Hardware Team"
    description: "初始化建立 SHT40 I2C 介面特規"

mfg: "SENSIRION"
pn: "SHT40"
description: "4th generation high-accuracy digital relative humidity and temperature sensor"

_meta:
  evidence: "Sensirion_Humidity_Sensors_SHT4x_Datasheet.pdf"
  page: 1
  excerpt: "The SHT4x is a digital sensor platform for measuring relative humidity and temperature."

interfaces:
  I2C:
    requires_series_resistor: false
    forbid_gnd_capacitor: false
    pullup_range_ohms: [1000, 10000]
    default_address: "0x44"
    _meta:
      evidence: "Sensirion_Humidity_Sensors_SHT4x_Datasheet.pdf"
      page: 6
      excerpt: "The SHT4x communicates via I2C interface. Default 7-bit I2C address is 0x44 (SHT40-AD1B) or 0x45 (SHT40-BD1B). Requires external pull-up resistors on SDA and SCL lines."
