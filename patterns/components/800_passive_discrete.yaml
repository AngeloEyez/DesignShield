# ---------------------------------------------------------
# DesignShield - Component Pattern Rule (Level 1)
# Category: Passive & Discrete
# ---------------------------------------------------------
# 負責辨識所有被動元件與分離式主動元件。
# 這部分規則仰賴標準的前綴 (Prefix) 或強烈的型號特徵。
# ---------------------------------------------------------

name: "rule_passive_capacitor"
enabled: true
description: "電容器 (Capacitor)"
priority: 850

matches:
  match_any:
    # 特徵 1: OrCAD 標準描述前綴 (最精準)
    - description: { prefix: "CAP," }
    # 特徵 2: 複合關鍵字比對
    - any_text: { regex: "(?i)\\b(CAP|CAPACITOR|MLCC)\\b" }
    # 特徵 3: 數值帶有容值單位 (如 1.2UF, 10NF, 47PF)
    - part_value: { regex: "(?i)\\b\\d+(\\.\\d+)?(UF|NF|PF)\\b" }
    # 特徵 4: 標準 RefDes 且引腳數相符 (最寬鬆)
    - match_all:
        - ref_des: { regex: "(?i)^(C|TC|PC)$" }
        - pins_count: { max: 2 }

assigns:
  category: "Passive"
  sub_category: "Capacitor"
  functional_role: "Passive_Support"  # 預設為一般支撐，Level 2 可能升級為 Filter
  is_electrical: true
  confidence: 0.85

---
name: "rule_passive_resistor"
enabled: true
description: "電阻器 (Resistor)"
priority: 840

matches:
  match_any:
    - description: { prefix: "RES," }

assigns:
  category: "Passive"
  sub_category: "Resistor"
  functional_role: "Passive_Support"
  is_electrical: true
  confidence: 0.85

---
name: "rule_passive_cmc"
enabled: true
description: "共模扼流圈 / 濾波器 (Common Mode Choke / Filter)"
priority: 855

matches:
  match_any:
    - any_text: { regex: "(?i)\\b(CMC|COMMON\\s+CHOKE|COMMON\\s+MODE\\s+CHOKE|COMMON\\s+FILTER)\\b" }
    - match_all:
        - ref_des: { regex: "(?i)^(TL|FL)$" }
        - pins_count: { max: 4 }

assigns:
  category: "Passive"
  sub_category: "Choke"
  functional_role: "Common_Mode_Choke"
  is_electrical: true
  confidence: 0.95

---
name: "rule_passive_ferrite_bead"
enabled: true
description: "磁珠 (Ferrite Bead)"
priority: 845

matches:
  match_any:
    - description: { prefix: "FB," }
    - any_text: { regex: "(?i)\\b(FERRITE|CHIP\\s+BEAD|FERRITE\\s+BEAD|FB)\\b" }
    - ref_des: { regex: "(?i)^(FB|PFB|TFB)$" }

assigns:
  category: "Passive"
  sub_category: "FerriteBead"
  functional_role: "Filter"
  is_electrical: true
  confidence: 0.90

---
name: "rule_passive_inductor"
enabled: true
description: "電感 (Inductor)"
priority: 830

matches:
  match_any:
    - description: { prefix: "FB," }
    - description: { prefix: "INDUCTOR," }
    - any_text: { regex: "(?i)\\b(INDUCTOR|CHIP\\s+INDUCTOR|COIL|CHOKE|FERRITE|CHIP\\s+BEAD|FB)\\b" }
    - part_value: { regex: "(?i)\\b\\d+(\\.\\d+)?(UH|NH|MH)\\b" }
    - match_all:
        - ref_des: { regex: "(?i)^(L|TL|PL|PFB)$" }
        - pins_count: { max: 4 }

assigns:
  category: "Passive"
  sub_category: "Inductor"      # 這裡統稱為 Inductor，若需要也可拆分 FerriteBead
  functional_role: "Filter"      # 電感/磁珠主要預設角色為濾波
  is_electrical: true
  confidence: 0.85

---
name: "rule_discrete_tvs"
enabled: true
description: "TVS / ESD 保護陣列"
priority: 860  # 比一般二極體優先

matches:
  match_any:
    - any_text: { regex: "(?i)\\b(TVS|ESD|TRANSIENT\\s+VOLTAGE|TVS-ARRAY)\\b" }
    - ref_des: { regex: "(?i)^TD$" }

assigns:
  category: "Discrete"
  sub_category: "TVS"
  functional_role: "Protection"
  is_electrical: true
  confidence: 0.90

---
name: "rule_discrete_diode"
enabled: true
description: "一般二極體 / Schottky / Zener"
priority: 820

matches:
  match_any:
    - any_text: { regex: "(?i)\\b(DIODE|SCHOTTKY|ZENER|RECTIFIER|LED)\\b" }
    - match_all:
        - ref_des: { regex: "(?i)^D$" }
        - pins_count: { max: 4 }

assigns:
  category: "Discrete"
  sub_category: "Diode"
  functional_role: "None"
  is_electrical: true
  confidence: 0.80

---
name: "rule_discrete_transistor"
enabled: true
description: "電晶體 / MOSFET"
priority: 810

matches:
  match_any:
    - description: { prefix: "MOS N," }
    - description: { prefix: "MOS P," }
    - description: { prefix: "MOS," }
    - any_text: { regex: "(?i)\\b(MOSFET|MOS\\s+[NP]|TRANSISTOR|BJT)\\b" }
    - ref_des: { regex: "(?i)^(Q|TQ|PQ)$" }

assigns:
  category: "Discrete"
  sub_category: "MOSFET"
  functional_role: "None"
  is_electrical: true
  confidence: 0.80

---
name: "rule_discrete_crystal"
enabled: true
description: "石英晶體振盪器 (Crystal)"
priority: 800

matches:
  match_any:
    - description: { prefix: "XTAL," }
    - any_text: { regex: "(?i)\\b(XTAL|CRYSTAL|OSCILLATOR|RESONATOR)\\b" }
    - part_value: { regex: "(?i)MHZ" }
    - ref_des: { regex: "(?i)^(Y|X|TX)$" }

assigns:
  category: "Discrete"
  sub_category: "Crystal"
  functional_role: "None"
  is_electrical: true
  confidence: 0.85
