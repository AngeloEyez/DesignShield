# ==============================================================================
# 電源致能、電源開關與平台休眠狀態控制訊號規範 (Power Control & Sequencing)
# ==============================================================================
# 開頭說明:
# 1. 訊號簡介:
#    涵蓋電路板中負責電源時序控制 (Power Sequencing)、穩壓器開關與平台狀態轉換的關鍵控制線：
#    - 電源致能/關斷: EN_1P8V, VCC_EN, ENABLE, SHDN, DIS
#    - 強制電源訊號: FORCE_PWR, TBT_FRC_PWR_1P8V, TBT_FRC_PWR_3P3V
#    - 平台休眠狀態: Intel/AMD ACPI 標準 SLP_S0#, SLP_S3#, SLP_S4#, SLP_S5#
#    - 電源按鈕與故障指示: FLEX_PWRBTN#, PDIN_FLTB (Fault), PDIN_SS (Soft-start)
# 2. 電氣特性與硬體要求:
#    電源控制訊號直接決定電源晶片 (LDO / Buck / Boost / PMIC) 的開關。
#    - 大多數致能引腳 (EN) 具備閾值電壓 (如 1.2V)，通常需要外部電阻分壓或偏置上拉/下拉，以防浮接導致電源不穩定或湧浪電流。
#    - 軟啟動 (Soft-Start, SS) 引腳常需外部接地電容來控制上電斜率 (Slew Rate)。
# 3. 典型應用:
#    DC-DC 穩壓器致能端、負載開關 (Load Switch)、主機板 PCH/SoC 休眠電源管理、Thunderbolt 供電控制。
# 4. 下游 Level 3 DRC 檢驗相依性:
#    - [DRC_PWR_CTRL_01] 檢查致能引腳 EN 是否具備預設上拉或下拉電阻，確保開機狀態確定 (Default State Pull Check)。
#    - [DRC_PWR_CTRL_02] 驗證軟啟動 (SS) 腳位之電容容值是否符合 PMIC 規格書要求之啟動時間。
#    - [DRC_PWR_CTRL_03] 檢查故障開漏引腳 (如 FLTB) 是否具備正確的上拉電阻至對應 I/O 電源軌。
# ------------------------------------------------------------------------------
name: "Power_Control"
category: "Control"
priority: 500 # 優先級 500 (訊號領域基礎控制線)

signals:
  # ----------------------------------------------------------------------------
  # Power_Enable: 電源致能與時序控制線 (Power Enable & Sequencing) - 必備訊號 (Required)
  # ----------------------------------------------------------------------------
  - role: "Power_Enable"
    required: true
    group_key: false
    matches:
      match_any:
        # 情境 A (高信心度 0.90): 以 EN_ 開頭或以 _EN / _ENABLE / _SHDN / _DIS 結尾之標準致能網路 (例如: EN_1P8V, VCC_3P3_EN, LDO_ENABLE, BUCK_SHDN)
        - match_all:
            - net_name_regex: "(?i)(?:^EN_|.*_EN$|.*_ENABLE|.*_SHDN|.*_DIS$)"
          confidence_contribution: 0.90
        # 情境 B (高信心度 0.90): 符合 ACPI 平台電源休眠規格之訊號 (例如: SLP_S3#, SLP_S0#, CPU_SLEEP, SYS_SLEEP)
        - match_all:
            - net_name_regex: "(?i)(?:SLP_S\\d|.*_SLEEP|^SLEEP)"
          confidence_contribution: 0.90
        # 情境 C (高信心度 0.90): 強制供電訊號或實體電源開關按鈕 (例如: FORCE_PWR, TBT_FRC_PWR, FLEX_PWRBTN#, POWER_BTN)
        - match_all:
            - net_name_regex: "(?i)(?:FORCE_PWR|FRC_PWR|PWRBTN|POWER_BTN)"
          confidence_contribution: 0.90
        # 情境 D (中高信心度 0.85): 電源輸入端故障指示或軟啟動電容接點 (例如: PDIN_FLTB, PDIN_SS, BUCK_SOFT_START)
        - match_all:
            - net_name_regex: "(?i)(?:PDIN_FLTB|PDIN_SS|PDIN_CAP)"
          confidence_contribution: 0.85

role_overrides:
  # 拓撲角色覆寫:
  # 1. 電源致能線連接至電源軌之電阻，升級為上拉偏置電阻 (Pull_up)
  - original_sub_category: "Resistor"
    connected_to: "PowerRail"
    new_role: "Pull_up"
  # 2. 電源致能線連接至接地端之電阻，升級為預設關斷下拉電阻 (Pull_down)
  - original_sub_category: "Resistor"
    connected_to: "GND"
    new_role: "Pull_down"
