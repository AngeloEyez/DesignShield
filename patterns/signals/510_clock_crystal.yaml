# ==============================================================================
# 時脈訊號與水晶振盪器 (Clock & Crystal Oscillator) 規範
# ==============================================================================
# 說明:
# 涵蓋電路中的主動時脈走線與被動石英晶體 (Crystal / Resonator) 振盪接線：
# 1. 晶振輸入/輸出腳位: _XI, _XO, XTAL_IN, XTAL_OUT (如 AN_JBR0_25M_XO, 25M_XI)
# 2. 頻率標註之時脈線: 25M_*, 32K_*, 100M_*, 48M_* 等
# 3. 一般時脈訊號: CLK, CLOCK, OSC, REFCLK
# ------------------------------------------------------------------------------
name: "Clock_Signal"
category: "Clock"
priority: 510

signals:
  - role: "Clock"
    required: true
    group_key: false
    matches:
      match_any:
        # 石英晶體 XI / XO 引腳命名 (包含經由阻抗串接的 _R_XI, _R_XO)
        - match_all:
            - net_name_regex: "(?i).*(?:_(?:R_)?X[IO]|XTAL.*)"
          confidence_contribution: 0.90
        # 標註頻率的時脈 (如 25M, 32K, 100M)
        - match_all:
            - net_name_regex: "(?i).*\\d+(?:M|K)Hz?.*(?:CLK|OSC|XO|XI)"
          confidence_contribution: 0.90
        # 標準 CLK 關鍵字
        - match_all:
            - net_name_regex: "(?i)(?:.*_CLK|.*_CLOCK|REFCLK)"
          confidence_contribution: 0.85

role_overrides:
  # 晶體振盪兩端的匹配負載電容
  - original_sub_category: "Capacitor"
    connected_to: "GND"
    new_role: "Filter_Capacitor"
  # 晶體振盪兩端的串聯阻尼電阻
  - original_sub_category: "Resistor"
    connected_to: "Signal"
    new_role: "Series_Resistor"
